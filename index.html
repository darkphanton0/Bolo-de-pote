<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Yellow</title>
</head>
<body>
    <div class="docinhos-fundo" aria-hidden="true">
        <span>🍰</span><span>🧁</span><span>🍪</span><span>🍩</span><span>🍮</span><span>🍰</span>
    </div>
    <header class="cab">
        <a href="index.html" class="marca" aria-label="Página inicial">
            <span class="marca-simbolo"><img src="img/lirio2.webp" alt=""></span>
            <span class="marca-texto"><strong>Yellow</strong><small>doces artesanais</small></span>
        </a>
        <form class="pesquisa" role="search">
            <label for="pesquisa">Pesquisar</label>
            <input type="search" name="pesquisa" id="pesquisa" placeholder="Pesquisar...">
            <button type="submit" aria-label="Pesquisar">
                <img src="img/lupa.png" alt="">
            </button>
        </form>
        <div class="acoes-cabecalho">
            <button type="button" class="carrinho" aria-label="Abrir carrinho, 0 itens" aria-expanded="false" aria-controls="painel-carrinho">
                <span aria-hidden="true">🛒</span>
                <span class="contador-carrinho">0</span>
            </button>
        </div>
        <aside class="painel-carrinho" id="painel-carrinho" aria-label="Carrinho de compras" hidden>
            <div class="topo-carrinho">
                <h2>Seu carrinho</h2>
                <button type="button" class="fechar-carrinho" aria-label="Fechar carrinho">&times;</button>
            </div>
            <div class="lista-carrinho">
                <p class="carrinho-vazio">Seu carrinho está vazio.</p>
            </div>
            <div class="total-carrinho">
                <span>Total</span>
                <strong>R$ 0,00</strong>
            </div>
            <button type="button" class="finalizar-carrinho" id="abrir-checkout" disabled>Continuar pedido</button>
        </aside>
    </header>
    <nav class="nav" aria-label="Navegação principal">
        <div class="botoes">
            <a href="index.html" aria-label="Início" class="nav-ativo"><img src="img/home.png" alt=""></a>
            <a href="compartilhar.html" aria-label="Compartilhar"><img src="img/compartilhar.png" alt=""></a>
            <a href="contato.html" aria-label="Contato"><img src="img/contato.png" alt=""></a>
        </div>
    </nav>
    <main class="grade" id="conteudo">
        <div class="cabecalho-cardapio">
            <div>
                <p class="etiqueta">Nosso cardápio</p>
                <h2>Escolha seu sabor</h2>
            </div>
            <p class="quantidade">6 opções disponíveis</p>
        </div>

        <div class="filtros-cardapio">
            <label for="filtro-categoria">Categoria</label>
            <select id="filtro-categoria">
                <option value="todas">Todas</option>
            </select>
        </div>

        <section class="cardapio" aria-label="Itens do cardápio"></section>
    </main>
    <section class="checkout-pedido" id="checkout-pedido" hidden aria-labelledby="titulo-checkout">
        <div class="checkout-cabecalho">
            <div>
                <p class="etiqueta">Quase lá</p>
                <h2 id="titulo-checkout">Complete seus dados</h2>
            </div>
            <button type="button" class="fechar-checkout" id="fechar-checkout" aria-label="Fechar formulário">&times;</button>
        </div>
        <p class="checkout-ajuda">Essas informações serão incluídas no pedido enviado pelo WhatsApp.</p>
        <form class="checkout-carrinho" id="checkout-carrinho">
            <label for="cliente-nome">Seu nome</label>
            <input type="text" id="cliente-nome" placeholder="Como podemos chamar você?" required>
            <label for="cliente-endereco">Endereço</label>
            <input type="text" id="cliente-endereco" placeholder="Onde entregar?" required>
            <label for="cliente-observacoes">Observações</label>
            <textarea id="cliente-observacoes" rows="2" placeholder="Ex.: sem cobertura, tocar a campainha..."></textarea>
            <button type="submit" class="finalizar-carrinho">Fazer pedido pelo WhatsApp</button>
        </form>
    </section>
    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
